<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - poly-txt</title>
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="min-h-screen flex items-center justify-center">
      <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <div class="flex flex-col items-center mb-6">
          <img src="/static/icon.svg" alt="" width="56" height="56" class="h-14 w-14 mb-3">
          <h1 class="text-2xl font-bold text-center text-gray-800">Create Account</h1>
          <p class="text-sm text-gray-500 mt-1">poly-txt</p>
        </div>

        {{if .Error}}
        <div
          class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"
        >
          {{.Error}}
        </div>
        {{end}} {{if not .RegistrationDisabled}}
        <form method="POST" action="/register" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
            >Name</label>
            <input
              type="text"
              name="name"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
            >Email</label>
            <input
              type="email"
              name="email"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
            >Password</label>
            <input
              type="password"
              name="password"
              required
              minlength="6"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
          </div>
          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition"
          >
            Create Account
          </button>
        </form>
        {{end}}

        <p class="mt-4 text-center text-sm text-gray-600">
          {{if .RegistrationDisabled}}
          <a href="/login" class="text-blue-600 hover:underline"
          >Go to sign in</a>
          {{else}} Already have an account?
          <a href="/login" class="text-blue-600 hover:underline">Sign In</a>
          {{end}}
        </p>
      </div>
    </div>
  </body>
</html>
